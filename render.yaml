# Render Blueprint Specification to deploy the Django backend.
# Reference: https://render.com/docs/blueprints

services:
  - type: web
    name: purnia-care-backend
    env: python
    rootDir: backend
    # Run dependencies install, static files bundle and database migrations on build
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # Run the production gunicorn server binding to Render's allocated port
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      
      # OPTION A: SQLite with Persistent Disk (Uncomment database disk settings below and set SQLITE_DB_PATH)
      # - key: SQLITE_DB_PATH
      #   value: /data/db.sqlite3

      # OPTION B: PostgreSQL Database (Default blueprint configuration)
      - key: DATABASE_URL
        fromDatabase:
          name: purnia-care-db
          property: connectionString

    # OPTION A: Persistent Disk Config for SQLite (Uncomment if you want to use SQLite in production for free)
    # hasDisk: true
    # disk:
    #   name: sqlite-data-volume
    #   mountPath: /data
    #   sizeGB: 1

databases:
  # Provisions a free tier PostgreSQL database for OPTION B
  - name: purnia-care-db
    plan: free
