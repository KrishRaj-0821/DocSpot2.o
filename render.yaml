# Render Blueprint Specification to deploy the Django backend.
# Reference: https://render.com/docs/blueprints

services:
  - type: web
    name: docspot-backend
    env: python
    rootDir: backend
    # Run dependencies install, static files bundle and database migrations on build
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # Run the production gunicorn server binding to Render's allocated port
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://docspot.vercel.app,https://docspot-pro.vercel.app"
      - key: DATABASE_URL
        sync: false

databases:
  # Provisions a free tier PostgreSQL database for OPTION B
  - name: docspot-db
    plan: free
